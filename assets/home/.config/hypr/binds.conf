# binds.conf — keybindings (raw asset, live-editable)

$mod = ALT
$win = SUPER

# ── Applications ─────────────────────────────────────────────────────────
bind = $mod, R, exec, ranger
bind = $mod, F4, killactive
bind = $mod, F3, exec, dmenu_run -m 0
bind = $mod SHIFT, E, exec, hyprctl dispatch exit
bind = $mod SHIFT, R, exec, systemctl restart --user ags.service
bind = $win, F, togglefloating
bind = $win, T, exec, kitty -e bash -lc yazi
bind = $win, B, exec, $BROWSER
bind = $win, SPACE, exec, fcitx5-remote -t

# ── Screenshots ──────────────────────────────────────────────────────────
bind = CTRL SHIFT, 2, exec, grimblast copy output
bind = CTRL SHIFT, 3, exec, grimblast copy active
bind = CTRL SHIFT, 4, exec, SLURP_ARGS="-b$slurpBackground -c$slurpBorder -s$slurpSelection -w1" grimblast copy area

# ── Audio ────────────────────────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# ── Workspace layout ─────────────────────────────────────────────────
bind = $mod, GRAVE, exec, ~/.config/hypr/scripts/toggle-workspace-layout.sh

# ── Workspace focus ──────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# ── Window focus (vim) ───────────────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, TAB, layoutmsg, cyclenext
bind = $mod SHIFT, TAB, layoutmsg, cycleprev

# ── Alt-hold alt-tab overlay ─────────────────────────────────────────────
# Pressing Alt alone pops the AGS alt-tab overlay (the current workspace's
# clients); releasing Alt closes it.
#
# On release, Hyprland reports the modifier state at the moment of the
# release event — Alt is still held at that instant, which is why the
# release bind needs the ALT modifier in the pattern (bare-modifier
# `bindr` doesn't fire in this Hyprland build). Both Alt_L and Alt_R are
# covered so either physical Alt key closes it.
bind = , Alt_L, exec, ags request alt-tab-open
bind = , Alt_R, exec, ags request alt-tab-open
bindrt = $mod, Alt_L, exec, ags request alt-tab-close
bindrt = $mod, Alt_R, exec, ags request alt-tab-close

# ── Window move (vim) ────────────────────────────────────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# ── Move window to workspace (stay put, like sway's move) ────────────────
bind = $win, 1, movetoworkspacesilent, 1
bind = $win, 2, movetoworkspacesilent, 2
bind = $win, 3, movetoworkspacesilent, 3
bind = $win, 4, movetoworkspacesilent, 4
bind = $win, 5, movetoworkspacesilent, 5
bind = $win, 6, movetoworkspacesilent, 6
bind = $win, 7, movetoworkspacesilent, 7
bind = $win, 8, movetoworkspacesilent, 8
bind = $win, 9, movetoworkspacesilent, 9

# ── Move workspace to output ─────────────────────────────────────────────
bind = $win, H, movecurrentworkspacetomonitor, l
bind = $win, J, movecurrentworkspacetomonitor, d
bind = $win, K, movecurrentworkspacetomonitor, u
bind = $win, L, movecurrentworkspacetomonitor, r

# ── Resize (1 px steps) ──────────────────────────────────────────────────
bind = $win, UP, resizeactive, 0 1
bind = $win, DOWN, resizeactive, 0 -1
bind = $win, RIGHT, resizeactive, 1 0
bind = $win, LEFT, resizeactive, -1 0

# ── Splits (nearest dwindle equivalent of sway's split h/v) ──────────────
bind = $win, PLUS, layoutmsg, preselect r
bind = $win, MINUS, layoutmsg, preselect d

# ── Floating drag (sway floating_modifier) ───────────────────────────────
bindm = $win, mouse:272, movewindow
bindm = $win, mouse:273, resizewindow
