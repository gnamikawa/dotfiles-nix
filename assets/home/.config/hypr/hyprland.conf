# hyprland.conf — config body (raw asset, live-editable; ADR-0005)
#
# Computed slices join here. Everything they need a rebuild for is behind
# these three lines; everything else in this tree is save + `hyprctl reload`.
source = ~/.config/generated/hypr/theme.conf
source = ~/.config/generated/hypr/monitors.conf
source = ~/.config/generated/hypr/env.conf

source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf

debug {
    disable_logs = false
}

# ── General ──────────────────────────────────────────────────────────────
general {
    border_size = 1
    # sway `gaps inner 20` measured between windows; Hyprland gaps_in is
    # per-edge, so 10 reproduces the same 20px spacing.
    gaps_in = 10
    gaps_out = 0

    col.active_border = $borderActive
    col.inactive_border = $borderDefault

    layout = monocle
}

# ── Input ────────────────────────────────────────────────────────────────
input {
    # sway: focus_follows_mouse no
    follow_mouse = 0
}

# ── Misc ─────────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Parity notes vs. the retired sway config:
# - sway's urgent indicator color has no Hyprland equivalent; dropped.
# - `default_orientation horizontal` has no exact dwindle equivalent;
#   dwindle's aspect-based default is close enough on landscape outputs.
# - dbus-update-activation-environment and `workspace 1` at login are
#   handled by uwsm / Hyprland's own startup respectively.
