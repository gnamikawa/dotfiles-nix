# hyprlock.conf — lock screen (raw asset, live-editable)

source = ~/.config/generated/hypr/theme.conf

general {
    disable_loading_bar = true
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

background {
    path = /home/genzo/wallpaper.png
    blur_passes = 3
    blur_size = 8
}

input-field {
    size = 200, 50
    position = 0, -80
    monitor =
    dots_center = true
    fade_on_empty = false
    font_color = $lockFont
    inner_color = $lockInner
    outer_color = $lockOuter
    outline_thickness = 5
    placeholder_text = <span>Password...</span>
    shadow_passes = 2
}
