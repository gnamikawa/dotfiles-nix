# rules.conf — window rules (raw asset, live-editable)
# Syntax: Hyprland 0.53+ rewrote windowrule to `match:<field> <regex>, <rule> <value>`.

windowrule = match:class nm-connection-editor, float on
windowrule = match:class .blueman-manager-wrapped, float on
windowrule = match:class org.pulseaudio.pavucontrol, float on
windowrule = match:class Thunar match:title ^rename.*, float on

# Firefox Picture-in-Picture: parked top-right of the primary output,
# visible on every workspace (sway: sticky enable).
windowrule = match:class firefox match:title Picture-in-Picture, float on
windowrule = match:class firefox match:title Picture-in-Picture, size 426 240
windowrule = match:class firefox match:title Picture-in-Picture, move 1462 0
windowrule = match:class firefox match:title Picture-in-Picture, pin on
