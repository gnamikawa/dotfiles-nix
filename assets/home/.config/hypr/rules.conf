# rules.conf — window rules (raw asset, live-editable)

windowrule = float, class:nm-connection-editor
windowrule = float, class:.blueman-manager-wrapped
windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = float, class:Thunar, title:^rename.*

# Firefox Picture-in-Picture: parked top-right of the primary output,
# visible on every workspace (sway: sticky enable).
windowrule = float, class:firefox, title:Picture-in-Picture
windowrule = size 426 240, class:firefox, title:Picture-in-Picture
windowrule = move 1462 0, class:firefox, title:Picture-in-Picture
windowrule = pin, class:firefox, title:Picture-in-Picture
